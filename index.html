<title>مهام العمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">


<style>
:root{
--bg:#f3f5f9;--surface:#ffffff;--surface2:#f0f3f8;--ink:#131c33;--ink2:#48526b;--mut:#8b94aa;--line:#e1e6ef;
--navy:#14213d;--navy2:#22335a;--navy-ink:#ffffff;--gold:#c29a3e;--gold2:#e4c77f;--gold-soft:#f8f0dc;
--done:#2c8a60;--done-soft:#e2f3ea;--late:#c2453b;--late-soft:#fbe7e4;--wait:#a07412;--wait-soft:#fbf1d8;
--doing:#2f63b5;--doing-soft:#e4edfb;--violet:#6a4fb3;--violet-soft:#eee9fb;--teal:#1f8a8a;--teal-soft:#e0f4f3;
--shadow:0 1px 2px rgba(20,33,61,.05),0 8px 24px rgba(20,33,61,.07);--shadow-h:0 2px 4px rgba(20,33,61,.07),0 14px 32px rgba(20,33,61,.12);
--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0c1222;--surface:#141c30;--surface2:#1b2540;--ink:#e9edf6;--ink2:#b3bdd3;--mut:#7c88a4;--line:#26314f;
--navy:#1d2c52;--navy2:#2a3d6d;--gold:#d8b35e;--gold2:#e9cd8b;--gold-soft:#342c1b;--done:#63c796;--done-soft:#173327;
--late:#ee8a80;--late-soft:#3b2124;--wait:#e0bd62;--wait-soft:#362e1a;--doing:#8db5f2;--doing-soft:#1b2c4b;
--violet:#b3a0ef;--violet-soft:#2a2346;--teal:#6fd0cf;--teal-soft:#15312f;--shadow:none;--shadow-h:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}
/* hero */
.hero{margin-inline:-16px;padding:22px 16px 64px;background:radial-gradient(1200px 300px at 85% -40%,rgba(228,199,127,.28),transparent 60%),linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold2),var(--gold),var(--gold2),transparent)}
.hero-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.hero h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.hero h1 i{width:10px;height:26px;border-radius:3px;background:linear-gradient(var(--gold2),var(--gold));display:inline-block}
.hero .date{margin-top:4px;font-size:14px;color:#c9d2e8}
.hero .date b{color:#fff;font-weight:700}
.hero .date span{color:var(--gold2)}
.role{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;margin-top:10px}
.role.mgr{background:rgba(143,181,242,.18)}.role.demo{background:rgba(228,199,127,.2)}
.ringwrap{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--gold2) calc(var(--p)*1%),rgba(255,255,255,.14) 0);display:grid;place-items:center;transition:--p .6s}
.ring>div{width:66px;height:66px;border-radius:50%;background:var(--navy);display:grid;place-items:center;font-weight:800;font-size:18px}
.ringlbl{font-size:13px;color:#c9d2e8;line-height:1.4}.ringlbl b{display:block;color:#fff;font-size:15px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:-44px;position:relative;z-index:1}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.stat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--doing-soft);color:var(--doing)}
.stat .ic svg{width:22px;height:22px}
.stat.late .ic{background:var(--late-soft);color:var(--late)}.stat.wait .ic{background:var(--wait-soft);color:var(--wait)}.stat.done .ic{background:var(--done-soft);color:var(--done)}
.stat .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.stat .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.stat .l{font-size:12.5px;color:var(--ink2)}
.stat.late .n{color:var(--late)}.stat.done .n{color:var(--done)}.stat.wait .n{color:var(--wait)}
.bar{height:5px;background:var(--surface2);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--done),#4cc38a);border-radius:9px;transition:width .6s}
/* tabs */
nav.tabs{display:inline-flex;gap:4px;margin-block:22px 4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 16px;font-weight:700;color:var(--ink2);border-radius:9px;white-space:nowrap;transition:background .2s,color .2s}
nav.tabs button:hover{background:var(--surface2)}
nav.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
nav.tabs .c{font-size:11.5px;background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:1px 7px;margin-inline-start:6px;font-variant-numeric:tabular-nums}
nav.tabs button[aria-selected="true"] .c{background:rgba(255,255,255,.18);color:#fff}
/* day nav */
.daynav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block:18px 6px}
.daynav .nb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;color:var(--ink2);transition:all .2s}
.daynav .nb:hover{border-color:var(--gold);color:var(--ink);transform:translateY(-1px)}
.daynav .dl{flex:1;min-width:200px;text-align:center}
.daynav .dl b{display:block;font-size:20px;font-weight:800}
.daynav .dl span{font-size:13px;color:var(--gold);font-weight:500}
.daynav input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px}
.pages{display:flex;gap:8px;margin-block:12px 16px}
.pages button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-weight:700;color:var(--ink2);display:flex;justify-content:center;gap:8px;align-items:center;transition:all .2s}
.pages button:hover{border-color:var(--gold)}
.pages button[aria-selected="true"]{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.pages .c{font-size:12px;background:rgba(127,140,170,.2);border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
/* sections */
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sec{--acc:var(--gold);--acc-soft:var(--gold-soft);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);border-top:4px solid var(--acc);animation:rise .35s ease both}
.sec.full{grid-column:1/-1}
.sec-meeting{--acc:var(--doing);--acc-soft:var(--doing-soft)}.sec-follow{--acc:var(--wait);--acc-soft:var(--wait-soft)}
.sec-admin{--acc:var(--violet);--acc-soft:var(--violet-soft)}.sec-task{--acc:var(--navy2);--acc-soft:var(--surface2)}.sec-notes{--acc:var(--teal);--acc-soft:var(--teal-soft)}
.sec>h3{margin:0;padding:12px 16px;font-size:15px;font-weight:800;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.sec>h3:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft);margin-inline-end:4px;flex:none}
.sec>h3{justify-content:flex-start}
.sec>h3 small{margin-inline-start:auto;font-weight:700;color:var(--acc);background:var(--acc-soft);font-size:11.5px;padding:2px 9px;border-radius:99px}
.sec>h3 i{font-style:normal}
.sec .list{border:0;border-radius:0}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line);transition:background .2s}
.task:hover{background:var(--surface2)}
.task:last-child{border-bottom:0}
.task.hi{box-shadow:inset -4px 0 0 var(--late)}
.task.mid{box-shadow:inset -4px 0 0 var(--gold)}
.task.compact{padding:10px 14px;gap:10px}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid #b7bfd1;background:var(--surface);margin-top:1px;display:grid;place-items:center;padding:0;transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.tick:hover:not(:disabled){border-color:var(--done);transform:scale(1.12)}
.tick:disabled{cursor:default;opacity:.7}
.tick svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .25s}
.task.isdone .tick{background:var(--done);border-color:var(--done)}
.task.isdone .tick svg{opacity:1;transform:none}
.tt{font-weight:600;font-size:15px;word-break:break-word;border-radius:6px;padding:0 3px;margin:0 -3px;transition:color .3s}
.task.isdone .tt{text-decoration:line-through;text-decoration-color:var(--mut);color:var(--mut);font-weight:500}
.tt[contenteditable="true"]:hover{background:var(--surface)}
.num{font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:800;color:var(--acc,var(--mut));background:var(--acc-soft,var(--surface2));min-width:22px;height:22px;border-radius:7px;display:grid;place-items:center;margin-top:1px}
.time{font-variant-numeric:tabular-nums;font-weight:800;color:var(--doing);background:var(--doing-soft);border-radius:8px;padding:1px 8px;font-size:13px;margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--ink2);align-items:center}
.pill{border-radius:99px;padding:1px 9px;font-weight:600;white-space:nowrap}
.pill.proj{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.pill.late{background:var(--late-soft);color:var(--late)}.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.doing{background:var(--doing-soft);color:var(--doing)}.pill.done{background:var(--done-soft);color:var(--done)}
.pill.rem{background:var(--gold-soft);color:var(--gold)}.pill.tech{background:var(--teal-soft);color:var(--teal)}.pill.adm{background:var(--violet-soft);color:var(--violet)}
.note{margin-top:6px;font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:8px;padding:6px 10px;white-space:pre-wrap;border-inline-start:3px solid var(--line)}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:280px;opacity:.75;transition:opacity .2s}
.task:hover .acts{opacity:1}
.acts select,.acts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12.5px;padding:4px 9px;color:var(--ink2);transition:all .15s}
.acts button:hover,.acts select:hover{border-color:var(--gold);color:var(--ink)}
.acts .del:hover{border-color:var(--late);color:var(--late)}
.acts a{font-size:12.5px;color:var(--gold);padding:4px 8px;text-decoration:none;border:1px solid var(--gold-soft);border-radius:8px}
.more{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;animation:rise .25s ease both}
.more input,.more textarea,.more select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px}
.more textarea{flex:1 1 100%;min-height:56px;resize:vertical}
.more button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px}
.more .del{color:var(--late);border-color:var(--late-soft)}
.addrow{display:flex;gap:6px;padding:10px 12px;border-top:1px dashed var(--line);background:linear-gradient(0deg,var(--acc-soft),transparent 140%)}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14.5px;transition:border-color .2s,box-shadow .2s}
.addrow input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.addrow input.sm{flex:0 0 100px}
.addrow input[type=time]{flex:0 0 108px}
.addrow select{border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:13px;padding:4px 8px}
.addrow button{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:0 14px;font-weight:800;font-size:18px;transition:transform .15s,filter .15s}
.addrow button:hover{transform:scale(1.06);filter:brightness(1.1)}
.sec-task .addrow button,.sec-top .addrow button{background:var(--navy)}
.empty{padding:26px 18px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.notes{flex:1;min-height:170px;border:0;background:transparent;padding:12px 16px;resize:vertical;font-size:14.5px;line-height:1.9;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.9em - 1px),var(--line) calc(1.9em - 1px),var(--line) 1.9em);background-attachment:local}
.notes:focus{outline:none}
.saved{font-size:12px;color:var(--mut);padding:0 16px 8px}
.tfilter{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:13px;color:var(--mut)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--ink2);transition:all .15s}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.grp{margin-block:20px 8px;display:flex;align-items:baseline;gap:10px}
.grp h3{margin:0;font-size:15px;font-weight:800}
.grp small{color:var(--mut);font-size:12.5px}
/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-top:16px}
.report h2{margin:0 0 4px;font-size:20px}
.report .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2)}
.rbox h4{margin:0 0 6px;font-size:13.5px;color:var(--gold);font-weight:800}
.rbox ul{margin:0;padding-inline-start:18px;font-size:14px}
.rbox li{margin-block:3px}.rbox li small{color:var(--mut)}
.projrow{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-block:7px}
.projrow .nm{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projrow .b{flex:1;height:9px;background:var(--surface);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.projrow .b i{display:block;height:100%;background:linear-gradient(90deg,var(--done),#4cc38a)}
.projrow .v{font-variant-numeric:tabular-nums;color:var(--ink2);width:52px;text-align:left}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--navy);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--ink)}
/* files */
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:3px 4px 3px 9px;font-size:12.5px;max-width:100%}
.fchip a{color:var(--ink);text-decoration:none;display:inline-flex;gap:6px;align-items:center;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip a:hover{color:var(--gold)}
.fchip .ic{font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 5px;background:var(--surface2);color:var(--ink2);flex:none}
.fchip .ic.pdf{background:var(--late-soft);color:var(--late)}.fchip .ic.img{background:var(--doing-soft);color:var(--doing)}.fchip .ic.lnk{background:var(--gold-soft);color:var(--gold)}
.fchip button{border:0;background:none;color:var(--mut);padding:0 5px;font-size:13px}
.fchip button:hover{color:var(--late)}
.attach{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.attach .lbl{font-weight:700;color:var(--ink2)}
.attach input[type=url],.attach input.ln{width:170px}
.upbtn{border:1px solid var(--gold);color:var(--gold);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.attach small{color:var(--mut);flex:1 1 100%}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--late)}
/* banner & toast */
.banner{margin-top:14px;font-size:13.5px;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold2);border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center}
.banner:before{content:"ℹ";font-weight:800;color:var(--gold)}
.banner.err{background:var(--late-soft);border-color:var(--late);color:var(--late)}
.banner.err:before{content:"!";color:var(--late)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;animation:drop .3s ease both}
.toast.err{background:var(--late)}
@keyframes drop{from{opacity:0;transform:translate(50%,-10px)}to{opacity:1;transform:translate(50%,0)}}
.ro{display:none}
@media (max-width:760px){.sheet{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.rgrid{grid-template-columns:1fr}
.task{grid-template-columns:auto 1fr}.acts{grid-column:1/-1;justify-content:flex-start;max-width:none;opacity:1}.hero h1{font-size:23px}.ring{width:70px;height:70px}.ring>div{width:54px;height:54px;font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.task[data-lead="1"]{grid-template-columns:auto auto 1fr auto}
@media (max-width:760px){.task[data-lead="1"]{grid-template-columns:auto auto 1fr}.more{grid-column:1/-1}}


.pill.fin{background:var(--done-soft);color:var(--done)}
.pill.asg{background:var(--violet-soft);color:var(--violet)}
.hero-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.hero-tools .role{margin-top:0}
.hbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700}
.hbtn:hover{background:rgba(255,255,255,.18)}
#viewSel{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:700}
#viewSel option{color:#131c33}
.viewing{margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--violet-soft);color:var(--violet);border:1px solid var(--violet);border-radius:12px;padding:10px 14px;font-weight:700;font-size:13.5px}
.viewing button{margin-inline-start:auto;border:1px solid var(--violet);background:var(--surface);color:var(--violet);border-radius:8px;padding:4px 10px;font-weight:700}
/* login */
.auth{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 400px at 80% -10%,rgba(228,199,127,.25),transparent 60%),linear-gradient(135deg,var(--navy),var(--navy2));display:grid;place-items:center;padding:16px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border-radius:18px;padding:26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .35s ease both}
.auth-card h2{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px}
.auth-card h2 i{width:9px;height:22px;border-radius:3px;background:linear-gradient(var(--gold2),var(--gold));display:inline-block}
.auth-card p{margin:0 0 18px;color:var(--mut);font-size:13.5px}
.auth-card label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:12px}
.auth-card input{display:block;width:100%;margin-top:5px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px}
.auth-card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.auth-card .btn{width:100%;padding:11px;font-size:15px;margin-top:6px}
.auth-err{color:var(--late);font-size:13px;min-height:18px;margin-top:8px}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s;animation:rise .35s ease both}
.ucard:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.ucard .top{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));flex:none}
.ucard .nm b{display:block;font-size:15px}.ucard .nm small{color:var(--mut)}
.ustats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.ustats div{background:var(--surface2);border-radius:9px;padding:6px 2px}
.ustats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.ustats small{font-size:11px;color:var(--mut)}
.ustats .l b{color:var(--late)}.ustats .w b{color:var(--wait)}.ustats .d b{color:var(--done)}
.ucard .btn{padding:7px 12px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:16px}
.panel h3{margin:0 0 12px;font-size:16px}
.frm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frm input,.frm select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
.frm input.grow{flex:1;min-width:180px}
.utable{width:100%;border-collapse:collapse;font-size:14px}
.utable th{text-align:start;color:var(--mut);font-weight:700;font-size:12.5px;padding:8px;border-bottom:1px solid var(--line)}
.utable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.utable button,.utable select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12.5px}
.tag{border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}
.tag.admin{background:var(--gold-soft);color:var(--gold)}.tag.member{background:var(--doing-soft);color:var(--doing)}.tag.off{background:var(--late-soft);color:var(--late)}
.tblwrap{overflow-x:auto}
</style>
</head>
<body>

<header class="hero"><div class="hero-in">
<div><h1><i></i>مهام العمل</h1><div class="date" id="todayLbl"></div><div class="hero-tools"><span class="role" id="roleChip"></span><select id="viewSel" hidden aria-label="عرض مهام"></select><button class="hbtn" id="pwBtn" hidden>تغيير كلمة المرور</button><button class="hbtn" id="logoutBtn" hidden>خروج</button></div></div>
<div class="ringwrap"><div class="ringlbl"><b id="ringTxt">إنجاز اليوم</b><span id="ringSub">لا توجد مهام بعد</span></div><div class="ring" id="ring"><div id="ringPct">0%</div></div></div>
</div></header>
<div class="wrap">
<span class="ro" id="roBadge" hidden></span>
<section class="stats" aria-label="ملخص">
<div class="stat"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></span><span class="tx"><span class="n" id="sToday">0</span><span class="l">مفتوحة اليوم</span></span></div>
<div class="stat late"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg></span><span class="tx"><span class="n" id="sLate">0</span><span class="l">مرحّلة من أيام سابقة</span></span></div>
<div class="stat wait"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span class="tx"><span class="n" id="sWait">0</span><span class="l">بانتظار رد</span></span></div>
<div class="stat done"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="tx"><span class="n" id="sDone">0</span><span class="l">أُنجزت هذا الأسبوع</span><span class="bar"><i id="sBar" style="width:0"></i></span></span></div>
</section>
<div class="banner" id="banner" hidden></div>
<nav class="tabs" role="tablist">
<button role="tab" data-tab="day" aria-selected="true">صفحة اليوم</button>
<button role="tab" data-tab="upcoming" aria-selected="false">القادمة<span class="c" id="cUp">0</span></button>
<button role="tab" data-tab="report" aria-selected="false">ملخص الأسبوع</button>
<button role="tab" data-tab="team" aria-selected="false" id="tabTeam" hidden>لوحة الفريق</button>
<button role="tab" data-tab="users" aria-selected="false" id="tabUsers" hidden>المستخدمين</button>
</nav>
<div id="dayWrap">
<div class="daynav">
<button class="nb" id="prevDay" aria-label="اليوم السابق">‹ السابق</button>
<div class="dl"><b id="dayName"></b><span id="dayHijri"></span></div>
<button class="nb" id="nextDay" aria-label="اليوم التالي">التالي ›</button>
<button class="nb" id="goToday">اليوم</button>
<input type="date" id="pickDay" aria-label="اذهب لتاريخ">
</div>
<div class="pages" role="tablist">
<button role="tab" data-page="1" aria-selected="true">الصفحة 1 · أهم الأمور<span class="c" id="c1">0</span></button>
<button role="tab" data-page="2" aria-selected="false">الصفحة 2 · جدول المهام<span class="c" id="c2">0</span></button>
</div>
</div>
<main id="view"></main>
</div>
<datalist id="projList"></datalist>
<div class="toast" id="toast" hidden></div>
<div class="auth" id="auth" hidden><form class="auth-card" id="authForm" autocomplete="on"><h2><i></i><span id="authTitle">تسجيل الدخول</span></h2><p id="authSub">ادخل باسم المستخدم وكلمة المرور</p><div id="authFields"></div><button class="btn" id="authBtn">دخول</button><div class="auth-err" id="authErr"></div><button type="button" class="btn ghost" id="demoBtn" style="margin-top:10px;width:100%">جرّب نسخة العرض (بدون حساب)</button></form></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => iso(new Date());
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const DAYN = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const gFmt = new Intl.DateTimeFormat("ar-EG-u-nu-latn",{day:"numeric",month:"long"});
const gFmtY = new Intl.DateTimeFormat("ar-EG-u-nu-latn",{day:"numeric",month:"long",year:"numeric"});
let hFmt; try { hFmt = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"}); } catch { hFmt = null; }
const hij = d => hFmt ? hFmt.format(d) : "";
const nice = s => { const diff = daysBetween(today(), s);
if (diff === 0) return "اليوم"; if (diff === 1) return "بكرة"; if (diff === 2) return "بعد بكرة"; if (diff === -1) return "أمس";
const d = parse(s); return `${DAYN[d.getDay()]} ${gFmt.format(d)}`; };
const weekStart = () => { const d = new Date(); d.setHours(0,0,0,0); return addDays(d, -d.getDay()); };
const STATUS = {todo:"جديدة", doing:"جاري العمل", waiting:"بانتظار رد"};
const KIND = { top:"أهم 6 مهام ★", meeting:"الاجتماعات والمواعيد", follow:"متابعات — بانتظار رد", admin:"مهام إدارية", task:"جدول المهام" };
const TTYPE = { tech:"فنية", admin:"إدارية", fin:"مالية" };
const API = "https://script.google.com/macros/s/AKfycbwgvjkn2Op3hg-sSwxMi3PJO4MmIot0udoa8FXKOGTK9LBjqKuGtqlLYY1FaAkMwnI9/exec";
let TOKEN = ""; try { TOKEN = localStorage.getItem("tasks_token") || ""; } catch {}
let ME = null, USERS = [], viewUid = "", allItems = [];
const isAdmin = () => !!ME && ME.role === "admin";
const uname = id => (USERS.find(u => u.id === id) || {}).name || "";
const own = x => isAdmin() || (!!ME && x.owner === ME.id);
const canDel = x => isAdmin() || !x.assignedBy || (!!ME && x.assignedBy === ME.id);
let ROLE = "", MGR = "المدير"; let isMgr = false, isDemo = false;
const ROLL = new Set(["top","follow","admin","task"]); // meetings don't roll over
let items = [], notes = {};
let db = null, col = null, mcp = null, assets = null, canWrite = false;
let tfilter = "all";
let tab = "day", page = "1", day = today(), open = null, confirmDel = null;
function setChip(){ const c = $("#roleChip"); c.textContent = ME ? ME.name + " · " + (isAdmin() ? "مدير" : "مستخدم") : "جارٍ التحميل…"; c.className = "role" + (isAdmin() ? "" : " mgr");
$("#logoutBtn").hidden = !ME; $("#pwBtn").hidden = !ME || isDemo; if (ME) $("#logoutBtn").textContent = isDemo ? "خروج من العرض" : "خروج"; $("#tabTeam").hidden = !isAdmin(); $("#tabUsers").hidden = !isAdmin();
const s = $("#viewSel"); s.hidden = !isAdmin() || USERS.filter(u => u.active).length < 2;
if (!s.hidden) s.innerHTML = USERS.filter(u => u.active).map(u => `<option value="${u.id}" ${u.id === viewUid ? "selected" : ""}>${u.id === ME.id ? "مهامي" : "مهام: " + esc(u.name)}</option>`).join(""); }
setChip();
$("#todayLbl").innerHTML = (() => { const d = new Date(); return `<b>${DAYN[d.getDay()]} ${gFmtY.format(d)}</b> · <span>${esc(hij(d))}</span>`; })();
function toast(m, err){ const t = $("#toast"); t.textContent = m; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
function banner(m, err){ const b = $("#banner"); b.textContent = m || ""; b.className = "banner" + (err ? " err" : ""); b.hidden = !m; }
function handleWriteErr(err){
if (err && err.code === "invalid_argument") { setReadOnly(true); banner("ليس لديك صلاحية التعديل — هذه الصفحة للاطلاع فقط."); }
else if (err && err.code === "quota_exceeded") banner("امتلأت قاعدة البيانات. احذف بعض البنود المنجزة القديمة ثم حاول مجدداً.");
else { const msg = "تعذّر الحفظ: " + ((err && err.message) || "تأكد من الاتصال وحاول مرة أخرى."); banner(msg, true); toast("لم يتم الحفظ — شوف الرسالة فوق", true); }
}
async function upd(id, data){ if (!col) return; try { await col.doc(id).update(data); } catch (e) { handleWriteErr(e); } }
// ---------- calendar ----------
function calLink(x){
const time = x.time || x.reminder?.time || "09:00"; const [h,m] = time.split(":").map(Number);
const d = x.due.replace(/-/g,""); const e = new Date(2000,0,1,h,m+30);
const q = new URLSearchParams({ action:"TEMPLATE", text:x.title, details: x.project ? `المشروع: ${x.project}` : "",
dates:`${d}T${pad(h)}${pad(m)}00/${d}T${pad(e.getHours())}${pad(e.getMinutes())}00`, ctz:"Asia/Riyadh" });
return "https:\/\/calendar.google.com/calendar/render?" + q.toString();
}
async function addToCalendar(x, time){
if (!x.due) return;
if (!mcp) { await upd(x.id, { reminder: { time, state: "link" } }); toast("استخدم زر «أضف للتقويم» بجانب البند"); return; }
const [h,m] = time.split(":").map(Number); const e = new Date(2000,0,1,h,m+(x.kind === "meeting" ? 60 : 30));
try {
const r = await mcp.callTool("Google Calendar", "create_event", {
summary: x.title, description: (x.project ? `المشروع: ${x.project}\n` : "") + "من صفحة مهام العمل",
startTime: `${x.due}T${pad(h)}:${pad(m)}:00+03:00`, endTime: `${x.due}T${pad(e.getHours())}:${pad(e.getMinutes())}:00+03:00`,
timeZone: "Asia/Riyadh", overrideReminders: [{ method: "popup", minutes: x.kind === "meeting" ? 15 : 10 }],
availability: x.kind === "meeting" ? "AVAILABILITY_BUSY" : "AVAILABILITY_FREE"
});
const p = r && r.payload; const eid = p && typeof p === "object" ? (p.id || p.eventId || (p.event && p.event.id) || "") : "";
await upd(x.id, { reminder: { time, state: "added", eventId: String(eid || "") } });
toast("أُضيف تذكير في Google Calendar");
} catch (err) {
const c = err && err.code; let msg = "تعذّر إضافة التذكير — استخدم زر «أضف للتقويم» بجانب البند.";
if (c === "server_not_connected") msg = "تعذّر الوصول للتقويم. استخدم زر «أضف للتقويم».";
else if (c === "needs_reauth") msg = "أعد ربط Google Calendar من إعدادات claude.ai ← Connectors.";
else if (c === "not_in_manifest") msg = "لم تسمح للصفحة بالوصول للتقويم. استخدم زر «أضف للتقويم» بجانب البند.";
else if (c === "tool_error") msg = "رفض التقويم إنشاء الحدث: " + (err.message || "");
banner(msg); await upd(x.id, { reminder: { time, state: "link" } });
}
}
// ---------- data for a day ----------
function forDay(d){
const t = today();
return items.filter(x => {
if (x.due === d) return true;
// automatic rollover: unfinished items from earlier days show on today
return d === t && ROLL.has(x.kind) && !x.done && x.due && x.due < t;
});
}
const sortItems = arr => arr.slice().sort((a,b) => (a.done - b.done) || ((a.due < b.due) ? -1 : (a.due > b.due) ? 1 : 0) || ((b.priority||0)-(a.priority||0)) || (a.createdAt - b.createdAt));
// ---------- row ----------
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function row(x, i){
const t = today();
const late = !x.done && x.due && x.due < t && ROLL.has(x.kind);
const pills = [];
if (x.kind === "task" && x.star && page === "2" && tab === "day") pills.push(`<span class="pill rem">★ من أهم 6</span>`);
if ((x.kind === "task" || x.kind === "top") && x.ttype) pills.push(`<span class="pill ${({admin:"adm",fin:"fin"})[x.ttype] || "tech"}">${TTYPE[x.ttype] || ""}</span>`);
if (x.kind === "task" && x.project) pills.push(`<span class="pill proj">${esc(x.project)}</span>`);
if (late) { const n = daysBetween(x.due, t); pills.push(`<span class="pill late">مرحّلة من ${esc(nice(x.due))}${n > 1 ? ` · ${n} أيام` : ""}</span>`); }
if (x.kind === "follow" && x.from) pills.push(`<span class="pill wait">من: ${esc(x.from)}</span>`);
if (x.kind === "task" && x.status === "doing" && !x.done) pills.push(`<span class="pill doing">جاري العمل</span>`);
if (x.kind === "task" && x.status === "waiting" && !x.done) pills.push(`<span class="pill wait">بانتظار رد</span>`);
if (x.priority === 2 && !x.done) pills.push(`<span class="pill late">عاجلة</span>`);
if (x.assignedBy && x.assignedBy !== x.owner) pills.push(`<span class="pill asg">📌 أسندها ${esc(uname(x.assignedBy) || "المدير")}</span>`);
if (x.reminder && !x.done && x.reminder.state === "added") pills.push(`<span class="pill rem">⏰ ${esc(x.reminder.time)} · في التقويم</span>`);
if (x.done && x.doneAt && iso(new Date(x.doneAt)) !== x.due) pills.push(`<span class="pill done">أُنجزت ${esc(nice(iso(new Date(x.doneAt))))}</span>`);
let acts = "";
if (canWrite && own(x)) {
if (!x.done) {
if (x.kind === "task") acts += `<button data-a="star" data-id="${x.id}" title="${x.star ? "إزالة من أهم 6" : "إضافة لأهم 6"}" aria-pressed="${!!x.star}" style="${x.star ? "color:var(--gold);border-color:var(--gold)" : ""}">${x.star ? "★" : "☆"}</button>`;
if (x.kind === "task") acts += `<select data-a="status" data-id="${x.id}" aria-label="الحالة">${Object.keys(STATUS).map(s => `<option value="${s}" ${ (x.status||"todo")===s?"selected":""}>${STATUS[s]}</option>`).join("")}</select>`;
if (x.kind !== "meeting") acts += `<button data-a="tomorrow" data-id="${x.id}">لبكرة</button>`;
if (x.kind === "meeting" && x.time && (!x.reminder || x.reminder.state !== "added")) acts += `<button data-a="calMeet" data-id="${x.id}">⏰ للتقويم</button>`;
if (x.reminder && x.reminder.state === "link") acts += `<a href="${esc(calLink(x))}" target="_blank" rel="noopener">أضف للتقويم</a>`;
}
acts += `<button data-a="more" data-id="${x.id}" aria-expanded="${open===x.id}" title="تفاصيل ومرفقات">📎 …</button>`;
}
let more = "";
if (open === x.id && canWrite && own(x)) {
more = `<div class="more">
<label>التاريخ <input type="date" data-f="due" data-id="${x.id}" value="${x.due || ""}"></label>
${x.kind === "meeting" ? `<label>الوقت <input type="time" data-f="time" data-id="${x.id}" value="${x.time || ""}"></label>` : ""}
${x.kind === "task" ? `<label>المشروع <input data-f="project" data-id="${x.id}" value="${esc(x.project)}" list="projList" style="width:130px"></label>
<label>الأولوية <select data-f="priority" data-id="${x.id}">${[0,1,2].map(p => `<option value="${p}" ${(x.priority||0)===p?"selected":""}>${["عادية","مهمة","عاجلة"][p]}</option>`).join("")}</select></label>` : ""}
${x.kind === "task" || x.kind === "top" ? `<label>النوع <select data-f="ttype" data-id="${x.id}"><option value="">—</option>${Object.keys(TTYPE).map(k => `<option value="${k}" ${x.ttype===k?"selected":""}>${TTYPE[k]}</option>`).join("")}</select></label>` : ""}
${x.kind === "follow" ? `<label>من <input data-f="from" data-id="${x.id}" value="${esc(x.from)}" style="width:130px"></label>` : ""}
${!isMgr && x.kind !== "meeting" && x.due && !x.done ? `<label>تذكير <input type="time" data-f="remTime" data-id="${x.id}" value="${x.reminder?.time || "09:00"}"></label><button data-a="remind" data-id="${x.id}">أضف للتقويم</button>` : ""}
<textarea data-f="note" data-id="${x.id}" placeholder="ملاحظة…">${esc(x.note)}</textarea>
<div class="attach"><span class="lbl">المرفقات</span>
${(mcp || assets) ? `<label class="upbtn">رفع ملف<input type="file" data-a="upload" data-id="${x.id}" multiple hidden></label>` : ""}
<input class="ln" data-l="name" data-id="${x.id}" placeholder="اسم الرابط (مثلاً: عقد التصميم)">

function statsFor(uid){

}
